[project]
name = "ara-agent"
version = "0.1.0"
description = "ARA-1: Autonomous Financial Research Agent"
requires-python = ">=3.12"
readme = "README.md"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' --strict-markers"
markers = [
    "network: hits a live API (yfinance). Excluded by default; run with -m network",
]
